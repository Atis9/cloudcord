name: Diagnose Bot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/setup-kubectl@e30ae091d7932a5f6919803061a96da1e82915eb # v5
        with:
          version: v1.33.9
      - uses: chitoku-k/actions/setup-kubectl-context@ccb4fe0fc11aeed48083a569230cb6d9edff2c94
        with:
          namespace: nyantech
      - name: Check Discord connectivity in the cluster
        shell: bash
        run: |
          image=$(kubectl get deployment/cloudcord -o jsonpath='{.spec.template.spec.containers[0].image}')
          pod="cloudcord-egress-$GITHUB_RUN_ID"
          trap 'kubectl delete pod "$pod" --ignore-not-found --wait=false' EXIT
          kubectl run "$pod" --image="$image" --restart=Never --labels=app=cloudcord,component=diagnostics \
            --overrides='{"spec":{"automountServiceAccountToken":false,"nodeSelector":{"kubernetes.io/arch":"amd64"},"securityContext":{"runAsNonRoot":true,"runAsUser":65532,"runAsGroup":65532,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"check","image":"'"$image"'","securityContext":{"allowPrivilegeEscalation":false,"readOnlyRootFilesystem":true,"capabilities":{"drop":["ALL"]}},"resources":{"requests":{"cpu":"10m","memory":"16Mi"},"limits":{"cpu":"100m","memory":"64Mi"}},"command":["/bin/sh","-c"],"args":["echo DNS; getent ahosts discord.com; for host in discord.com cloudflare.com; do for family in -4 -6; do echo HTTPS $host $family; printf '\''GET /api/v10/gateway HTTP/1.1\\r\\nHost: %s\\r\\nConnection: close\\r\\n\\r\\n'\'' $host | timeout 20 openssl s_client $family -quiet -connect $host:443 -servername $host -verify_hostname $host -verify_return_error 2>&1 | head -c 2000; echo; done; done"]}]}}'
          for attempt in $(seq 1 60); do
            phase=$(kubectl get pod "$pod" -o jsonpath='{.status.phase}')
            case "$phase" in Succeeded|Failed) break;; esac
            sleep 2
          done
          kubectl logs "$pod"
      - name: Remove temporary kubeconfig
        if: always()
        shell: bash
        run: rm -f "${KUBECONFIG:-$HOME/.kube/config}"
