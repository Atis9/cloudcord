name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm exec wrangler deploy -- --dry-run --outdir ../dist/worker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-${{ github.sha }}
          path: dist/worker/
          if-no-files-found: error
          retention-days: 7
  bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Test and build native container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: cloudcord:sha-${{ github.sha }}-amd64
          outputs: type=docker,dest=${{ runner.temp }}/cloudcord-amd64.tar
          cache-from: type=gha,scope=bot-amd64
          cache-to: type=gha,mode=max,scope=bot-amd64
          provenance: false
      - name: Validate runtime and package artifact
        env:
          IMAGE_TAR: ${{ runner.temp }}/cloudcord-amd64.tar
          COMMIT: ${{ github.sha }}
          ARCH: amd64
        run: |
          docker load --input "$IMAGE_TAR"
          image="cloudcord:sha-$COMMIT-$ARCH"
          runtime=(--rm --read-only --tmpfs /tmp:rw,nosuid,nodev,size=32m --cap-drop ALL --security-opt no-new-privileges)
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = '65532:65532'
          docker run "${runtime[@]}" --entrypoint /usr/bin/test "$image" -x /usr/local/bin/cloudcord
          docker run "${runtime[@]}" --entrypoint /usr/bin/ffmpeg "$image" -hide_banner -encoders | grep libopus
          docker run "${runtime[@]}" --entrypoint /usr/bin/ffmpeg "$image" -hide_banner -filters | grep deesser
          if startup=$(docker run "${runtime[@]}" "$image" 2>&1); then
            echo 'Expected startup to require Discord configuration.' >&2
            exit 1
          fi
          jq -e 'select(.msg == "startup_failed" and .error == "DISCORD_TOKEN is required")' <<< "$startup"
          printf 'Bot image bytes: %s\n' "$(docker image inspect "$image" --format '{{.Size}}')"
          mkdir -p dist
          gzip -n -c "$IMAGE_TAR" > dist/cloudcord-linux-$ARCH-docker.tar.gz
          printf 'Compressed Bot image archive bytes: %s\n' "$(stat -c %s "dist/cloudcord-linux-$ARCH-docker.tar.gz")"
          (cd dist && sha256sum cloudcord-linux-$ARCH-docker.tar.gz > SHA256SUMS-$ARCH)
          printf '%s\n' "$COMMIT" > dist/COMMIT-$ARCH
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bot-linux-amd64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
