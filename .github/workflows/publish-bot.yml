name: Publish Bot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-bot-${{ github.sha }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      REPOSITORY: ${{ github.repository }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Find successful CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh api --method GET "repos/$REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f head_sha="$COMMIT" -f status=success -f per_page=20 \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].id // empty')
          test -n "$run_id" || { echo 'Run CI successfully on the current main commit first.' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bot-linux-amd64-${{ github.sha }}
          path: images
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified amd64 image
        working-directory: images
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          tag="$image:sha-$COMMIT"
          test "$(cat COMMIT-amd64)" = "$COMMIT"
          sha256sum --check SHA256SUMS-amd64
          gzip -dc cloudcord-linux-amd64-docker.tar.gz | docker load
          local_image="cloudcord:sha-$COMMIT-amd64"
          test "$(docker image inspect "$local_image" --format '{{.Architecture}}')" = amd64
          docker tag "$local_image" "$tag"
          docker push "$tag"
          docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' > "$RUNNER_TEMP/manifest.json"
          digest=$(jq -er .digest "$RUNNER_TEMP/manifest.json")
          {
            echo '### Bot image (linux/amd64)'
            echo
            echo "\`$image@$digest\`"
            echo
            echo 'Use this digest in the Deploy Bot workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
