name: Publish Bot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-bot-${{ github.sha }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      REPOSITORY: ${{ github.repository }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bot-linux-*-${{ github.sha }}
          path: images
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified platform images
        working-directory: images
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          for arch in amd64 arm64; do
            test "$(cat "COMMIT-$arch")" = "$COMMIT"
            sha256sum --check "SHA256SUMS-$arch"
            gzip -dc "cloudcord-linux-$arch-docker.tar.gz" | docker load
            local_image="cloudcord:sha-$COMMIT-$arch"
            test "$(docker image inspect "$local_image" --format '{{.Architecture}}')" = "$arch"
            docker tag "$local_image" "$image:sha-$COMMIT-$arch"
            docker push "$image:sha-$COMMIT-$arch"
          done
      - name: Create multi-architecture image
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          tag="$image:sha-$COMMIT"
          docker buildx imagetools create --tag "$tag" \
            "$image:sha-$COMMIT-amd64" "$image:sha-$COMMIT-arm64"
          docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' > "$RUNNER_TEMP/manifest.json"
          jq -e '[.manifests[].platform.architecture] | sort == ["amd64","arm64"]' "$RUNNER_TEMP/manifest.json"
          digest=$(jq -er .digest "$RUNNER_TEMP/manifest.json")
          {
            echo '### Bot image'
            echo
            echo "\`$image@$digest\`"
            echo
            echo 'Use this digest in the Deploy Bot workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
