name: Deploy Worker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_BOT_API_TOKEN: ${{ secrets.CLOUDFLARE_BOT_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
      WORKER_URL: ${{ vars.CLOUDFLARE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Validate deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID variable'; exit 1; }
          test -n "$WORKER_URL" || { echo 'Missing CLOUDFLARE_API_BASE_URL variable'; exit 1; }
          test -n "$CLOUDFLARE_BOT_API_TOKEN" || { echo 'Missing CLOUDFLARE_BOT_API_TOKEN secret'; exit 1; }
      - run: npm ci
        working-directory: worker
      - run: npm run typecheck && npm test
        working-directory: worker
      - name: Provision shared API secret
        run: node scripts/worker-secrets.mjs
      - name: Deploy tested Worker
        run: npm exec wrangler deploy
        working-directory: worker
      - name: Check deployed Worker (no inference)
        env:
          WORKER_URL: ${{ vars.CLOUDFLARE_API_BASE_URL }}
        run: node scripts/worker-health.mjs
