name: Deploy Worker
on:
  workflow_dispatch:
    inputs:
      verify_speech:
        description: 'Generate short Japanese, Chinese, English, Korean and mixed speech samples (billable)'
        type: boolean
        default: false
      speech_engine:
        description: 'Engine to verify; does not change the default engine'
        type: choice
        options: [configured, grok]
        default: configured
      probe_minimax_voice:
        description: 'Check a MiniMax voice through AI Gateway without deploying (billable)'
        type: string
        default: ''
      probe_gemini_voice:
        description: 'Check a Gemini 3.8 TTS voice through AI Gateway without deploying (billable)'
        type: string
        default: ''
      probe_gemini_engine:
        description: 'Gemini model to use for the voice probe'
        type: choice
        options: [gemini, gemini-lite]
        default: gemini
  workflow_call:
permissions:
  contents: read
concurrency:
  group: worker-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_BOT_API_TOKEN: ${{ secrets.CLOUDFLARE_BOT_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
      WORKER_URL: ${{ vars.CLOUDFLARE_API_BASE_URL }}
      PROBE_ONLY: ${{ github.event_name == 'workflow_dispatch' && (inputs.probe_minimax_voice != '' || inputs.probe_gemini_voice != '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Validate deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID variable'; exit 1; }
          test -n "$WORKER_URL" || { echo 'Missing CLOUDFLARE_API_BASE_URL variable'; exit 1; }
          test -n "$CLOUDFLARE_BOT_API_TOKEN" || { echo 'Missing CLOUDFLARE_BOT_API_TOKEN secret'; exit 1; }
      - run: npm ci
        working-directory: worker
      - run: npm run typecheck && npm test
        working-directory: worker
      - name: Probe voice without deployment
        if: env.PROBE_ONLY == 'true'
        env:
          MINIMAX_VOICE: ${{ inputs.probe_minimax_voice }}
          GEMINI_VOICE: ${{ inputs.probe_gemini_voice }}
          GEMINI_ENGINE: ${{ inputs.probe_gemini_engine }}
        run: |
          set --
          if [ -n "$MINIMAX_VOICE" ]; then set -- "$@" minimax "$MINIMAX_VOICE"; fi
          if [ -n "$GEMINI_VOICE" ]; then set -- "$@" "$GEMINI_ENGINE" "$GEMINI_VOICE"; fi
          test "$#" -eq 2 || { echo 'Select one voice to probe'; exit 1; }
          PROBE_ENGINE="$1" PROBE_VOICE="$2" node scripts/worker-voice-check.mjs
      - name: Deploy tested Worker with shared API secret
        if: env.PROBE_ONLY == 'false'
        run: node scripts/worker-deploy.mjs
      - name: Check deployed Worker (no inference)
        if: env.PROBE_ONLY == 'false'
        env:
          WORKER_URL: ${{ vars.CLOUDFLARE_API_BASE_URL }}
        run: node scripts/worker-health.mjs
      - name: Check speech generation
        if: env.PROBE_ONLY == 'false' && inputs.verify_speech
        env:
          SPEECH_ENGINE: ${{ inputs.speech_engine }}
        run: node scripts/worker-speech-check.mjs
