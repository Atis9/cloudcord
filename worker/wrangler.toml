name = "cloudcord"
main = "src/entry.ts"
compatibility_date = "2026-10-03"
workers_dev = true

[ai]
binding = "AI"

[vars]
# The authenticated default AI Gateway is created on first use.
AI_GATEWAY_ID = "default"
TTS_VOICE = "Kore"
TTS_ENGINE = "gemini"
GROK_VOICE = "rex"
# BOT_API_TOKEN is provisioned by the Deploy Worker GitHub Actions workflow.
