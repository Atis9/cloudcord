apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudcord
  namespace: nyantech
spec:
  podSelector:
    matchLabels:
      app: cloudcord
  policyTypes: [Egress]
  egress:
    # HTTPS and Discord Gateway
    - ports:
        - port: 443
          protocol: TCP
        - port: 443
          protocol: UDP
    # Discord voice WebSocket
    - ports:
        - port: 2053
          protocol: TCP
        - port: 2083
          protocol: TCP
        - port: 2087
          protocol: TCP
        - port: 2096
          protocol: TCP
        - port: 8443
          protocol: TCP
    # Discord voice UDP
    - ports:
        - port: 19294
          endPort: 19344
          protocol: UDP
        - port: 50000
          endPort: 65535
          protocol: UDP
